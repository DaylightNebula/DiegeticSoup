name: Release

# Push a tag like v0.1.0 to build, test and publish a GitHub release.
# Tags with a suffix (v0.1.0-beta.1) are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          ./gradlew build -Pversion="$VERSION"
          ./gradlew :test-minestom:runMinestomTests -PskipClient=true -Pversion="$VERSION"

      # The same modules under JitPack's group and version (the tag), laid out as a Maven repository.
      # JitPack installs this instead of building, since Java on its build image is unreliable; see jitpack.yml.
      - name: Build the JitPack repository
        run: |
          group="com.github.${GITHUB_REPOSITORY_OWNER}.${GITHUB_REPOSITORY#*/}"
          ./gradlew publishToMavenLocal -Pdiegetic.group="$group" -Pversion="$GITHUB_REF_NAME" -Dmaven.repo.local="$PWD/build/jitpack-repo"
          (cd build/jitpack-repo && zip -qr "$GITHUB_WORKSPACE/jitpack-maven-repo.zip" .)
          unzip -l jitpack-maven-repo.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          files=()
          for module in core minestom paper; do
            files+=("$module/build/libs/diegetic-$module-$VERSION.jar" "$module/build/libs/diegetic-$module-$VERSION-sources.jar")
          done
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${files[@]}" \
            jitpack-maven-repo.zip
