name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # Builder, DSL, font and CSS flexbox scenarios: everything that needs no Minecraft client.
      - name: Scenarios without a client
        run: ./gradlew :test-minestom:runMinestomTests -PskipClient=true

  # The full scenario suite against a real Minecraft client (NebsClient), rendered with Mesa under Xvfb.
  client-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      # The client install is about 700 MB, so keep it between runs. Bump the key with the nebs-api version.
      - name: Cache the Minecraft client
        uses: actions/cache@v4
        with:
          path: .nebs/template
          key: nebs-template-v0.3.2

      - name: Run the scenario suite
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :test-minestom:runMinestomTests

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-screenshots
          path: test-minestom/build/test-screenshots/
          if-no-files-found: ignore

      - name: Upload client logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs
          path: .nebs/instances/*/logs/
          if-no-files-found: ignore
