# JitPack build: https://jitpack.io/#DaylightNebula/DiegeticSoup
# Modules are served as com.github.DaylightNebula.DiegeticSoup:diegetic-<module>:<tag>.
#
# Tagged releases install the artifacts the release workflow built and attached (jitpack-maven-repo.zip);
# anything else builds with Gradle. See .jitpack/install.sh for why.

# Only needed for the Gradle fallback: the project needs Java 25, which JitPack's `jdk:` list doesn't offer.
before_install:
  - sdk install java 25.0.4-tem
  - sdk use java 25.0.4-tem

install:
  - bash .jitpack/install.sh
