# JitPack build: https://jitpack.io/#DaylightNebula/DiegeticSoup
# The project needs Java 25, which JitPack's `jdk:` list doesn't offer, so install it with SDKMAN.
before_install:
  - sdk install java 25.0.4-tem
  - sdk use java 25.0.4-tem

# Publish under JitPack's coordinates (com.github.DaylightNebula.DiegeticSoup:diegetic-<module>:<tag>),
# so the POMs' dependencies between modules point at artifacts JitPack actually serves.
#
# Since early October 2026, Java on JitPack's "latest" build image can't read jars in the checkout
# (https://github.com/jitpack/jitpack.io/issues/8096), which breaks ./gradlew. This tries the
# wrapper in place, then a copy of it outside the checkout, then a Gradle installed by SDKMAN.
# Once JitPack is fixed, this can go back to:
#   ./gradlew publishToMavenLocal -Pdiegetic.group=$GROUP.$ARTIFACT -Pversion=$VERSION
install:
  - export JAVA_HOME="${SDKMAN_DIR:-$HOME/.sdkman}/candidates/java/25.0.4-tem"; export PATH="$JAVA_HOME/bin:$PATH"; ARGS="publishToMavenLocal -Pdiegetic.group=$GROUP.$ARTIFACT -Pversion=$VERSION"; mkdir -p "$HOME/diegetic-wrapper"; cp gradle/wrapper/gradle-wrapper.* "$HOME/diegetic-wrapper/"; echo "== build - wrapper in place"; java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain $ARGS || { echo "== build - wrapper copied to HOME"; java -cp "$HOME/diegetic-wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain $ARGS; } || { echo "== build - SDKMAN gradle"; source "${SDKMAN_DIR:-$HOME/.sdkman}/bin/sdkman-init.sh"; sdk install gradle 9.7.0 && "${SDKMAN_DIR:-$HOME/.sdkman}/candidates/gradle/9.7.0/bin/gradle" $ARGS; }
